plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group
base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'AliyunPublic'
		url = 'https://maven.aliyun.com/repository/public'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'MinecraftLibraries'
		url = 'https://libraries.minecraft.net/'
	}
}

loom {
	runs {
		client {
			client()
			ideConfigGenerated = true
			runDir = 'run'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Attacher uses jdk.attach — compile separately, keep out of the mod/agent jar.
sourceSets {
	main {
		java {
			exclude '**/attacher/**'
		}
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
	manifest {
		attributes(
				'Agent-Class': 'com.mikasa.copybuilding.CopyBuildingAgent',
				'Premain-Class': 'com.mikasa.copybuilding.CopyBuildingAgent',
				'Can-Redefine-Classes': 'true',
				'Can-Retransform-Classes': 'true'
		)
	}
}

tasks.register('buildAttacher', JavaCompile) {
	source = fileTree('src/main/java') {
		include '**/attacher/**'
	}
	classpath = files()
	destinationDirectory = layout.buildDirectory.dir('attacher-classes')
	options.release = 25
	options.encoding = 'UTF-8'
	options.compilerArgs += ['--add-modules', 'jdk.attach']
}

tasks.named('build') {
	dependsOn 'buildAttacher'
}
